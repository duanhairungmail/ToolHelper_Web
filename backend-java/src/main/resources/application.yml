server:
  address: 127.0.0.1
  port: ${TOOLHELPER_PORT:18081}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: toolhelper-local-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
toolhelper:
  data-root: ${TOOLHELPER_DATA_ROOT:.runtime/local-data}
  allowed-origins:
    - http://127.0.0.1:5173
    - http://localhost:5173
  supported-versions:
    - 5.12.6
  dbx:
    supported-versions:
      - 0.6.72
  max-download-bytes: 536870912
  max-extracted-bytes: 2147483648
  max-entry-bytes: 1073741824
  max-archive-entries: 30000
  max-path-depth: 24
  max-user-data-bytes: 2147483648
  task-retention-days: 7
  max-task-records: 1000
  api-validation:
    timeout-seconds: 15
    max-response-bytes: 2097152
    max-pages: 1000
    max-rows: 100000
  device-mac:
    max-rows: 1000
    concurrency: 4
    timeout-seconds: 10
    max-field-characters: 256
    max-file-bytes: 2097152
    max-request-bytes: 4194304
  druid:
    max-targets: 100
    concurrency: 4
    request-seconds: 5
    target-seconds: 30
    max-requests: 16
    max-response-bytes: 1048576
    max-request-bytes: 262144
  ping:
    max-targets: 4096
    max-concurrency: 200
    max-file-bytes: 2097152
    max-request-bytes: 4194304
    max-output-bytes: 65536
    max-tasks: 20
    retention-minutes: 30
  cron:
    threads: 2
    queue-capacity: 8
    timeout-ms: 2000
  sql:
    threads: 2
    queue-capacity: 4
    timeout-ms: 3000
logging:
  file:
    name: ${TOOLHELPER_LOG_FILE:${toolhelper.data-root}/logs/service.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
